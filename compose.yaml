services:
  app:
    build: .
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_NGINX: "1"
    volumes:
      - records:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
  nginx:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/http.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/proxy.conf:/etc/nginx/proxy-school.conf:ro
      - ./deploy/acme:/var/www/certbot:ro
    restart: unless-stopped
volumes:
  records:
