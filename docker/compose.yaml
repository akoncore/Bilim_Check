name: bilim-check

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bilim
      POSTGRES_USER: bilim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilim -d bilim"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,${DOMAIN:-localhost}
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY: "1"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  nginx:
    build:
      context: ..
      dockerfile: docker/nginx.Dockerfile
    depends_on:
      redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
  backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/acme:/var/www/certbot:ro
    restart: unless-stopped
volumes:
  postgres-data:
