services:
  backend:
    environment:
      COOKIE_SECURE: "1"
  nginx:
    ports:
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      NGINX_ENVSUBST_FILTER: ^DOMAIN$
    volumes:
      - ../nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
