name: CI and deployment
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - name: Build and smoke test Compose
        env:
          ADMIN_PASSWORD: ci-only-password
          HTTP_PORT: "8080"
        run: |
          docker compose up -d --build --wait
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8080/health
      - if: always()
        env:
          ADMIN_PASSWORD: ci-only-password
        run: docker compose down -v

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency: bilim-check-production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf "${RUNNER_TEMP}/bilim-check.tar.gz" app.py question-bank.json web Dockerfile compose.yaml compose.https.yaml .dockerignore deploy/http.conf deploy/proxy.conf deploy/https.conf.template
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/bilim-check && tar -xzf - && docker compose -f compose.yaml -f compose.https.yaml up -d --build --wait' < "${RUNNER_TEMP}/bilim-check.tar.gz"
