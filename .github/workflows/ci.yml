name: CI and deployment
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bilim
          POSTGRES_USER: bilim
          POSTGRES_PASSWORD: ci-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bilim -d bilim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      POSTGRES_PASSWORD: ci-db-password
      HTTP_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Django with PostgreSQL
        working-directory: backend
        env:
          POSTGRES_HOST: 127.0.0.1
        run: |
          pip install -r requirements.txt
          python manage.py makemigrations --check --dry-run --settings=bilim.test_settings
          python manage.py test --settings=bilim.test_settings -v 2
      - name: Build and smoke test full stack
        run: |
          docker compose -f docker/compose.yaml up -d --build --wait
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8080/health
          curl --fail http://127.0.0.1:8080/api/csrf/
          curl --fail http://127.0.0.1:8080/test/ | grep -F '/assets/'
      - if: failure()
        run: docker compose -f docker/compose.yaml logs --no-color
      - if: always()
        run: docker compose -f docker/compose.yaml down -v

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency: bilim-check-production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz -o "${RUNNER_TEMP}/bilim-check.tar.gz" HEAD backend frontend docker nginx .dockerignore
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/bilim-check && tar -xzf - && docker compose --env-file .env -f docker/compose.yaml -f docker/compose.https.yaml up -d --build --wait' < "${RUNNER_TEMP}/bilim-check.tar.gz"
